version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/repository/queries"
    gen:
      go:
        package: "repository"
        out: "internal/repository"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        # sqlc bỏ số nhiều của tên bảng trước khi đặt tên struct, và với
        # `scrape_via` nó ra `ScrapeVium` — "via" bị hiểu là số nhiều kiểu Latin
        # (như "medium"/"media"). Khoá của `rename` là tên ĐÃ qua bước đó, nên
        # phải viết `scrape_vium` chứ không phải tên bảng thật.
        rename:
          scrape_vium: "ScrapeVia"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
